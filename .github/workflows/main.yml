# Собирает установщики для Windows, macOS и Linux.
# Запуск: вкладка Actions → «Сборка программы» → Run workflow,
# или автоматически при публикации тега вида v1.0.0 (тогда файлы попадут в Releases).
name: Сборка программы

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Сборка установщика
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Веб-версия одним файлом
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/build-web.js
      - uses: actions/upload-artifact@v4
        with:
          name: Verstak3D-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist-web/*.html
          if-no-files-found: ignore
      - name: Публикация в Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist-web/*.html
